    label { font-weight: 900; }
    input, button {
      font: inherit; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border);

    button {

    }
    .out { margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--soft); }
    .kv { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #e5e7eb; }
    .kv:last-child { border-bottom: 0; }
    .badge-ok { color: var(--ok); font-weight: 900; }
    .badge-bad { color: var(--danger); font-weight: 900; }
    code { background:#eef2ff; padding:2px 6px; border-radius:8px; }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
    }

    function findByRoll(roll) {
      // Linear scan (fast enough for typical center lists). If needed, we can sort + binary search later.
      for (const r of RANGES) {
        if (roll >= r.start_roll_i && roll <= r.end_roll_i) return r;
      }
      return null;
    }

    function render(rec, roll) {
      const el = document.getElementById("result");
      if (!rec) {
        el.innerHTML = `<div class="badge-bad">Not found</div>
                        <div class="muted">No range matched for roll: <b>${escapeHtml(roll)}</b></div>`;
        return;
      }
      el.innerHTML = `
        <div class="kv"><div><b>Roll Number</b></div><div>${escapeHtml(roll)}</div></div>
        <div class="kv"><div><b>Seat Location (Building)</b></div><div>${escapeHtml(rec.building_name || "-")}</div></div>
        <div class="kv"><div><b>Floor</b></div><div>${escapeHtml(rec.floor || "-")}</div></div>
        <div class="kv"><div><b>Room</b></div><div>${escapeHtml(rec.room || "-")}</div></div>
        <div class="kv"><div><b>Center/Institute</b></div><div>${escapeHtml(rec.name_en || "-")}</div></div>
        <div class="kv"><div><b>Range</b></div><div>${escapeHtml(rec.start_roll_i)} – ${escapeHtml(rec.end_roll_i)}</div></div>
        <div class="kv"><div><b>Serial</b></div><div>${escapeHtml(rec.serial_no || "-")}</div></div>
      `;
    }

    function doFind() {
      const raw = document.getElementById("roll").value.trim();
      if (!raw) {
        render(null, "Please enter a roll number");
        return;
      }
      const roll = parseInt(raw, 10);
      if (Number.isNaN(roll)) {
        render(null, raw);
        return;
      }
      const rec = findByRoll(roll);
      render(rec, String(roll));
    }

    document.getElementById("findBtn").addEventListener("click", doFind);
    document.getElementById("roll").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doFind();
    });

    document.getElementById("status").innerHTML =
      `<span class="badge-ok">Loaded</span> ${RANGES.length} roll ranges.`;
  </script>
